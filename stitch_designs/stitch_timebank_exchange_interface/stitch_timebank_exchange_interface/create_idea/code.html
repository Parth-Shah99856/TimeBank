<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

                        "on-error-container": "#ffdad6",

                        "secondary-fixed": "#a2eeff",

<style>
        body { background-color: #020617; } /* Deepest Navy Level 0 */
        .glass-panel {
            background-color: rgba(15, 23, 42, 0.4); /* Time Blue Level 1 with opacity */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .chrono-glow:focus-within {
            box-shadow: 0 0 16px rgba(93, 230, 255, 0.2);
            border-bottom-color: #5de6ff;
        }
        .btn-primary-glow:hover {
            box-shadow: 0 0 12px rgba(93, 230, 255, 0.5);
            filter: brightness(1.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface font-body-md min-h-screen flex flex-col pb-safe">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface-container/40 backdrop-blur-lg dark:bg-surface-container-high/40 shadow-[0_0_16px_rgba(190,198,224,0.1)] flex justify-between items-center px-margin-mobile h-16">
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<span class="font-headline-lg-mobile text-headline-lg-mobile tracking-tighter font-bold text-primary dark:text-primary-fixed-dim">TIMEBANK</span>
<div class="w-6"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content -->
<main class="flex-grow pt-24 px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto w-full pb-24">
<div class="max-w-2xl mx-auto">
<div class="mb-8 text-center md:text-left">
<h1 class="font-display-lg text-display-lg text-primary mb-2">Architect a Vision</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Propose a new initiative to the network. Exceptional ideas attract exceptional time.</p>
</div>
<form class="space-y-6">
<!-- Project Name -->
<div class="glass-panel rounded-xl p-6 transition-all duration-300 chrono-glow">
<label class="block font-label-caps text-label-caps text-secondary mb-2 uppercase" for="projectName">Project Designation</label>
<input class="w-full bg-transparent border-0 border-b border-surface-variant focus:ring-0 focus:border-secondary text-primary font-headline-md text-headline-md placeholder-on-surface-variant/30 py-2 transition-colors" id="projectName" placeholder="e.g., Quantum Data Synchronization" type="text"/>
</div>
<!-- Vision -->
<div class="glass-panel rounded-xl p-6 transition-all duration-300 chrono-glow">
<label class="block font-label-caps text-label-caps text-secondary mb-2 uppercase" for="projectVision">Core Directive (Vision)</label>
<textarea class="w-full bg-transparent border-0 border-b border-surface-variant focus:ring-0 focus:border-secondary text-on-surface font-body-lg text-body-lg placeholder-on-surface-variant/30 py-2 resize-none transition-colors" id="projectVision" placeholder="Detail the structural impact and intended outcome of this temporal investment..." rows="4"></textarea>
</div>
<!-- Required Skills -->
<div class="glass-panel rounded-xl p-6 transition-all duration-300 chrono-glow">
<label class="block font-label-caps text-label-caps text-secondary mb-3 uppercase">Required Competencies</label>
<div class="flex flex-wrap gap-2 mb-3" id="skillTagsContainer">
<!-- Default tags -->
<span class="inline-flex items-center px-3 py-1 rounded-full bg-surface-variant text-primary text-sm font-mono-data border border-white/5">
                            Systems Design
                            <button class="ml-2 text-on-surface-variant hover:text-error focus:outline-none" type="button"><span class="material-symbols-outlined text-[14px]" data-icon="close">close</span></button>
</span>
</div>
<div class="flex items-center bg-surface-container rounded-lg p-1 border border-white/5 focus-within:border-secondary/50">
<span class="material-symbols-outlined text-on-surface-variant ml-2" data-icon="add">add</span>
<input class="flex-grow bg-transparent border-0 focus:ring-0 text-on-surface font-mono-data text-mono-data placeholder-on-surface-variant/50 py-2" placeholder="Add skill parameter..." type="text"/>
</div>
</div>
<!-- Initial Time Goal -->
<div class="glass-panel rounded-xl p-6 transition-all duration-300 chrono-glow">
<label class="block font-label-caps text-label-caps text-secondary mb-2 uppercase" for="timeGoal">Initial Temporal Capital (Hours)</label>
<div class="flex items-center">
<span class="material-symbols-outlined text-tertiary mr-3 text-3xl" data-icon="schedule" data-weight="fill" style="font-variation-settings: 'FILL' 1;">schedule</span>
<input class="w-32 bg-transparent border-0 border-b border-surface-variant focus:ring-0 focus:border-secondary text-primary font-display-lg text-display-lg placeholder-on-surface-variant/30 py-1 transition-colors text-right" id="timeGoal" min="1" placeholder="100" type="number"/>
</div>
</div>
<!-- Submit Action -->
<div class="pt-6">
<button class="w-full bg-secondary text-on-secondary font-headline-md text-headline-md py-4 rounded-xl btn-primary-glow transition-all duration-300 flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined" data-icon="rocket_launch" data-weight="fill" style="font-variation-settings: 'FILL' 1;">rocket_launch</span>
                        Initialize Protocol
                    </button>
</div>
</form>
</div>
</main>
<!-- Suppressed BottomNavBar & SideNav as this is a transactional/linear flow -->
</body></html>
