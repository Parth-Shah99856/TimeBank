<style>
        .glass-panel {
            background-color: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .chrono-glow {
            box-shadow: 0 0 16px rgba(93, 230, 255, 0.2);
        }
        .chrono-glow:hover, .chrono-glow:focus-within {
            box-shadow: 0 0 24px rgba(93, 230, 255, 0.4);
        }
        .input-glow-border {
            position: relative;
        }
        .input-glow-border::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }
        .input-glow-border:focus-within::after {
            background-color: #5de6ff;
            box-shadow: 0 -2px 8px rgba(93,230,255,0.5);
            height: 2px;
        }
        
        /* Hide scrollbar for clean aesthetic */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #081425; 
        }
        ::-webkit-scrollbar-thumb {
            background: #2a3548; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f465c; 
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased pt-16">
<!-- TopAppBar -->
<header class="bg-surface-container/40 backdrop-blur-lg dark:bg-surface-container-high/40 fixed top-0 w-full z-50 border-b border-white/10 shadow-[0_0_16px_rgba(190,198,224,0.1)] flex justify-between items-center px-margin-mobile h-16">
<button aria-label="Menu" class="text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile tracking-tighter font-bold text-primary dark:text-primary-fixed-dim">TIMEBANK</h1>
<button aria-label="Notifications" class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<!-- Main Content - Form -->
<main class="flex-grow flex flex-col items-center justify-start p-margin-mobile md:p-margin-desktop max-w-container-max mx-auto w-full relative z-10">
<!-- Background decorative glow -->
<div class="fixed top-1/4 left-1/4 w-96 h-96 bg-secondary/10 rounded-full blur-[100px] pointer-events-none z-0"></div>
<div class="w-full max-w-2xl relative z-10 space-y-8 mt-8">
<header class="text-center md:text-left mb-12">
<h2 class="font-headline-lg text-headline-lg md:font-display-lg md:text-display-lg text-on-surface mb-2">Offer a Skill</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Configure your service offering to begin earning time credits.</p>
</header>
<!-- Progress Bar -->
<div class="w-full h-1 bg-primary-container rounded-full overflow-hidden mb-8">
<div class="h-full bg-secondary w-1/3 shadow-[0_0_8px_rgba(93,230,255,0.8)]"></div>
</div>
<!-- Form Container -->
<div class="glass-panel rounded-xl p-6 md:p-8 space-y-8">
<form class="space-y-6">
<!-- Service Title -->
<div class="space-y-2 group">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase tracking-widest group-focus-within:text-secondary transition-colors" for="service-title">Service Title</label>
<div class="input-glow-border">
<input class="w-full bg-surface-container-high/50 border-none text-on-surface font-body-lg text-body-lg p-4 rounded-t-lg focus:ring-0 focus:outline-none transition-colors placeholder:text-on-surface-variant/40" id="service-title" placeholder="e.g., Advanced UI/UX Consultation" type="text"/>
</div>
</div>
<!-- Category -->
<div class="space-y-2 group">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase tracking-widest group-focus-within:text-secondary transition-colors" for="category">Category</label>
<div class="relative input-glow-border">
<select class="w-full bg-surface-container-high/50 border-none text-on-surface font-body-lg text-body-lg p-4 rounded-t-lg focus:ring-0 focus:outline-none transition-colors appearance-none cursor-pointer" id="category">
<option disabled="" selected="" value="">Select an expertise domain</option>
<option value="design">Design &amp; Architecture</option>
<option value="engineering">Software Engineering</option>
<option value="strategy">Business Strategy</option>
<option value="education">Mentorship &amp; Education</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Description -->
<div class="space-y-2 group">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase tracking-widest group-focus-within:text-secondary transition-colors" for="description">Detailed Description</label>
<div class="input-glow-border">
<textarea class="w-full bg-surface-container-high/50 border-none text-on-surface font-body-md text-body-md p-4 rounded-t-lg focus:ring-0 focus:outline-none transition-colors placeholder:text-on-surface-variant/40 resize-none" id="description" placeholder="Describe the specific value you provide and what a typical session involves..." rows="4"></textarea>
</div>
</div>
<!-- Hourly Credit Rate -->
<div class="space-y-2 group">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase tracking-widest group-focus-within:text-secondary transition-colors" for="rate">Hourly Credit Rate</label>
<div class="relative input-glow-border flex items-center bg-surface-container-high/50 rounded-t-lg p-4">
<span class="material-symbols-outlined text-secondary mr-3" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
<input class="w-full bg-transparent border-none text-on-surface font-mono-data text-mono-data focus:ring-0 focus:outline-none p-0 placeholder:text-on-surface-variant/40" id="rate" min="1" placeholder="0.0" step="0.5" type="number"/>
<span class="font-label-caps text-label-caps text-on-surface-variant ml-3 uppercase tracking-widest">CR/HR</span>
</div>
</div>
<!-- Actions -->
<div class="pt-6 flex flex-col md:flex-row gap-4 justify-end">
<button class="px-6 py-3 rounded-lg border border-secondary/50 text-secondary font-label-caps text-label-caps uppercase tracking-widest hover:bg-secondary/10 transition-colors" type="button">
                            Save Draft
                        </button>
<button class="px-6 py-3 rounded-lg bg-secondary text-on-secondary font-label-caps text-label-caps uppercase tracking-widest chrono-glow transition-all hover:brightness-110 active:scale-95" type="submit">
                            Continue to Availability
                        </button>
</div>
</form>
</div>
</div>
</main>
<!-- Suppressed Nav Shell - Transactional Page -->
<!-- The BottomNavBar is intentionally excluded here as this is a transactional/task-focused flow (multi-step form), maintaining user focus on the canvas. -->
</body></html>
