<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Custom Input Styling for Dark Theme */
        input:focus {
            outline: none;
            box-shadow: none;
        }
        
        /* Glow Animations */
        @keyframes subtle-pulse {
            0% { filter: drop-shadow(0 0 8px rgba(93,230,255,0.2)); }
            50% { filter: drop-shadow(0 0 16px rgba(93,230,255,0.4)); }
            100% { filter: drop-shadow(0 0 8px rgba(93,230,255,0.2)); }
        }
        .animate-glow {
            animation: subtle-pulse 3s infinite alternate;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col relative overflow-x-hidden selection:bg-secondary/30 selection:text-secondary">
<!-- Ambient Background Texture -->
<div class="absolute inset-0 z-0 opacity-20 bg-cover bg-center mix-blend-screen pointer-events-none" data-alt="A highly abstract, dark futuristic digital art piece serving as a background. Deep navy blue (#081425) dominates the canvas, accented by faint, luminous cyan (#5de6ff) topological lines and subtle glowing data nodes. The lighting is low-key and atmospheric, creating a premium, secure, and technologically advanced mood typical of high-end cybernetic interfaces. No text or discernible subjects." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAWNmdYifuXOAQGnRozNpsjZhDWxwTLMQgQBnFKppZAETGDHm-j0paGAWJWoRTI1vkaQYK4Znroh5Kcrl52YzJ_8zPcRZpJAQNkFvyqrZM4v2Bg_s0nGgbbl2QKwDawlF18_ctJiJ0p1ZQ9MgFIwVqIcJedrTE8li0DxoY8WpTIefvVwMoYlqO1X_f-KKQ1a486CJ5BwGDVL0SlJcoado4mt9b1cdRBrMO_J-U86wrWoHn62xmTh8xD')"></div>
<div class="absolute inset-0 z-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-surface-container-high/30 via-background to-background pointer-events-none"></div>
<!-- Header (Transactional - No Nav) -->
<header class="relative z-10 w-full px-margin-mobile py-6 flex justify-between items-center max-w-container-max mx-auto">
<a class="flex items-center gap-2 group" href="#">
<span class="material-symbols-outlined fill text-secondary text-2xl group-hover:scale-110 transition-transform">timelapse</span>
<span class="font-headline-md text-headline-md tracking-tighter font-bold text-primary">TIMEBANK</span>
</a>
<a class="text-on-surface-variant hover:text-on-surface transition-colors flex items-center gap-2" href="#">
<span class="font-label-caps text-label-caps uppercase">Cancel</span>
<span class="material-symbols-outlined text-sm">close</span>
</a>
</header>
<!-- Main Content -->
<main class="relative z-10 flex-grow flex items-center justify-center px-margin-mobile py-8">
<!-- Registration Glass Card -->
<div class="w-full max-w-md bg-surface-container/40 backdrop-blur-xl border border-white/10 rounded-xl overflow-hidden shadow-[0_8px_32px_rgba(0,0,0,0.4)]">
<!-- Progress Bar (Ultra-thin 4px) -->
<div class="w-full h-[4px] bg-surface-container-lowest">
<div class="h-full w-1/3 bg-secondary shadow-[0_0_8px_rgba(93,230,255,0.8)] transition-all duration-500 ease-out" id="progressBar"></div>
</div>
<div class="p-8">
<!-- Header Section -->
<div class="mb-8">
<div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-secondary/10 border border-secondary/20 mb-4">
<span class="material-symbols-outlined text-secondary text-sm">shield_person</span>
<span class="font-mono-data text-mono-data text-secondary">Step 1 of 3</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-2">Initialize Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join the decentralized network. Your time is the new standard of value.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-6" id="regForm" method="POST">
<!-- Full Name -->
<div class="relative group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 uppercase tracking-widest" for="fullName">Legal Name</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant group-focus-within:text-secondary transition-colors">person</span>
<input class="w-full bg-surface-container-lowest border-0 border-b-2 border-outline-variant text-on-surface font-body-md text-body-md pl-12 pr-4 py-4 rounded-t-md focus:border-secondary focus:ring-0 transition-colors peer placeholder-on-surface-variant/30" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
</div>
<!-- Email Address -->
<div class="relative group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 uppercase tracking-widest" for="email">Secure Comm Link</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant group-focus-within:text-secondary transition-colors">mail</span>
<input class="w-full bg-surface-container-lowest border-0 border-b-2 border-outline-variant text-on-surface font-body-md text-body-md pl-12 pr-4 py-4 rounded-t-md focus:border-secondary focus:ring-0 transition-colors peer placeholder-on-surface-variant/30" id="email" name="email" placeholder="jane@network.link" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div class="relative group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 uppercase tracking-widest flex justify-between" for="password">
<span>Cryptographic Key</span>
<span class="text-tertiary flex items-center gap-1 opacity-80"><span class="material-symbols-outlined text-[10px] fill">verified_user</span> Highly Encrypted</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant group-focus-within:text-secondary transition-colors">key</span>
<input class="w-full bg-surface-container-lowest border-0 border-b-2 border-outline-variant text-on-surface font-body-md text-body-md pl-12 pr-12 py-4 rounded-t-md focus:border-secondary focus:ring-0 transition-colors peer placeholder-on-surface-variant/30" id="password" minlength="8" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="visibilityIcon">visibility</span>
</button>
</div>
<div class="mt-2 flex gap-1 h-1 w-full rounded-full overflow-hidden opacity-50">
<div class="h-full w-1/4 bg-error"></div>
<div class="h-full w-1/4 bg-tertiary"></div>
<div class="h-full w-1/4 bg-secondary"></div>
<div class="h-full w-1/4 bg-surface-variant"></div>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full bg-secondary text-[#000000] font-label-caps text-label-caps uppercase py-4 px-6 rounded-lg hover:bg-secondary-fixed transition-all duration-300 active:scale-[0.98] flex items-center justify-center gap-2 group animate-glow hover:shadow-[0_0_24px_rgba(93,230,255,0.4)]" type="submit">
<span>Proceed to Validation</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
<!-- Trust Footer -->
<p class="text-center font-mono-data text-[12px] text-on-surface-variant/60 mt-6">
                        By proceeding, you adhere to the <a class="text-secondary hover:underline underline-offset-2" href="#">Architect's Protocol</a> and agree to safeguard community value.
                    </p>
</form>
</div>
</div>
</main>
<script>
        // Password Visibility Toggle
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const visibilityIcon = document.getElementById('visibilityIcon');

        toggleBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
            }
        });

        // Simple form submission animation (prevent default for demo)
        const form = document.getElementById('regForm');
        const progressBar = document.getElementById('progressBar');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = form.querySelector('button[type="submit"]');
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">refresh</span> <span>Encrypting...</span>`;
            btn.classList.add('opacity-80', 'pointer-events-none');
            
            // Animate progress bar to next step
            progressBar.style.width = '66.66%';
            
            setTimeout(() => {
                // Reset for demo purposes
                btn.innerHTML = `<span>Proceed to Validation</span><span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>`;
                btn.classList.remove('opacity-80', 'pointer-events-none');
                progressBar.style.width = '33.33%';
                alert('Account Info Captured. Proceeding to Step 2.');
            }, 1500);
        });
    </script>
</body></html>
